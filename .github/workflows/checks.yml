name: App checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test cricket logic and provider boundaries
        run: node --test --experimental-test-isolation=none test/*.test.mjs
